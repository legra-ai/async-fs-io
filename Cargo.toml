[package]
name = "async-fs-io"
version = "0.2.1"
description = "Async-first filesystem primitives, bounded reads, streaming directory access, and temporary resources"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/async-fs-io"
documentation = "https://docs.rs/async-fs-io"
readme = "README.md"
keywords = ["async", "filesystem", "tokio", "streaming", "io"]
categories = ["filesystem", "asynchronous"]
publish = true
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
fs2 = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "test-util", "process"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
